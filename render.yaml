# ===================================================================
#  Utility Duniya Bot — Render Blueprint (v108 SLIM)
#
#  ⚠️⚠️ SABSE ZAROORI BAAT — DATA KAHAN RAKHA JAYEGA ⚠️⚠️
#
#  Render ka FREE plan "ephemeral filesystem" deta hai. Iska matlab:
#      deploy / restart / sleep-wake / maintenance -> SAARA LOCAL DATA GAYAB
#
#  ✅ Iska hal built-in hai (PREMIUM VAULT) — kuch kharidne ki zaroorat NAHI:
#     1. Poora data ENCRYPTED backup ban kar (a) aapke Telegram par aur
#        (b) GitHub ke `vault-backup` branch me chala jata hai.
#     2. Bot uthte hi pichhla backup MERGE karta hai.
#     >>> Isliye deploy/restart par user data kho nahi sakta. <<<
#
# ===================================================================
#  📉 v108 me kya badla (RAM ka asli ilaaj)
# -------------------------------------------------------------------
#  Pehle 24 tools the. Video downloader (yt-dlp + ffmpeg), PDF/Excel
#  (reportlab, pdfplumber, openpyxl), image tools (Pillow, qrcode) aur
#  150MB upload (telethon) — ye sab IMPORT HOTE HI 300+ MB RAM le lete
#  the. Render free plan me total 512 MB hai, isliye Linux ka OOM killer
#  bot ko maar deta tha (logs me sirf "Killed") aur bot beech kaam me
#  ruk jaata tha. Aapke logs me yahi dikh raha tha:
#       MEMORY HIGH 466 MB (limit 512) — aggressive safai
#       MEMORY HIGH 489 MB (limit 512) — aggressive safai
#
#  v108 me sirf 2 tools bache (NUMBER INFO + FAMILY INFO) aur unki
#  libraries hi install hoti hain. Naap kar dekha gaya:
#       boot RAM : ~54 MB      (pehle ~224 MB)
#       chalte hue: ~62 MB     (pehle 416-489 MB)
#  Yani 512 MB ki limit ab chhuti hi nahi — bot rukega nahi.
# ===================================================================

services:
  - type: web
    name: utility-duniya-bot
    runtime: python
    region: singapore          # India ke sabse paas — sabse fast
    plan: free
    branch: main
    autoDeploy: true           # GitHub par push hote hi deploy ho jaye
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health   # polling aur webhook dono modes me 200 OK
                               # v108 FIX: ye page pehle kabhi-kabhi KHAALI
                               # body ke saath 200 deta tha (ek line crash ho
                               # jaati thi to poora page gayab). Ab har line
                               # alag guard me hai — page kabhi khaali nahi.

    envVars:
      # ---------- ZAROORI (Render khud poochhega — yahan mat likho) ----------
      - key: BOT_TOKEN
        sync: false            # BotFather ka token (SECRET — sirf Render me daalo)
      - key: ADMIN_ID
        sync: false            # apni Telegram numeric ID (@userinfobot se milegi)

      # ---------- OPTIONAL ----------
      - key: ADMINS
        sync: false            # extra admins, comma se alag: 123456,789012
      - key: FORCE_CHANNEL
        sync: false            # jaise @YourChannel (force-join chahiye to)
      - key: FORCE_CHANNEL_LINK
        sync: false            # https://t.me/YourChannel
      - key: OWNER_USERNAME
        value: Supermannn_x    # card ke neeche "Powered by" me yahi dikhta hai
      - key: BRAND_TAG
        value: "@Supermannn_x"

      # ---------- MODE ----------
      # DEFAULT = auto (webhook) — Render par sabse reliable. POLLING me deploy
      # ke waqt 10-20 second do instance ek saath getUpdates karte hain aur
      # Telegram "Conflict" deta hai. Webhook me Telegram khud update bhejta
      # hai -> Conflict 0. Fail ho to bot chup-chaap POLLING par chalta hai.
      - key: WEBHOOK_MODE
        value: auto            # auto | on | polling | off
      - key: WEBHOOK_URL
        sync: false            # khali = polling. Webhook ke liye service ka pura URL
      - key: WEBHOOK_SECRET
        sync: false            # webhook path ka optional secret

      # ==================================================================
      #  🛡️ PREMIUM VAULT (data kabhi na khoye) — YE ZAROOR BHARO
      # ==================================================================
      #  ⚠️ Backup ek ALAG branch (`vault-backup`) me jata hai — 'main' me
      #     NAHI! Warna har backup naya deploy trigger kar deta aur bot ka
      #     infinite restart loop ban jata.
      #
      #  ⚠️⚠️ AAPKE LOGS ME YE ERROR AA RAHA THA:
      #         GitHub backup fail: HTTP 401 { "message": "Bad credentials" }
      #     Matlab: VAULT_GITHUB_TOKEN purana / expire / galat hai.
      #     ➜ Naya GitHub token banao aur Render me VAULT_GITHUB_TOKEN
      #       update karo, warna GitHub backup band rahega.
      - key: VAULT_GITHUB_REPO
        value: himanshu75919-coder/utility-duniya-bot
      - key: VAULT_GITHUB_BRANCH
        value: vault-backup
      - key: VAULT_GITHUB_TOKEN
        sync: false            # 🔑 GitHub token (SECRET — sirf Render me daalo)
      - key: VAULT_KEY
        sync: false            # 🔑 apna encryption password — YE ZAROOR SET KARO.
                               # Khali chhoda to key BOT_TOKEN se banti hai, aur
                               # BotFather se token badalte hi purane backup
                               # padhe nahi ja payenge.
      - key: VAULT_BACKUP_MINUTES
        value: "60"            # v108: bot halka hai, itni jaldi backup ki zaroorat nahi
      - key: VAULT_ENABLED
        value: "on"            # off = poora vault band
      - key: VAULT_BACKUP_CHAT_ID
        sync: false            # (optional) backup alag chat me bhejni ho to

      # ==================================================================
      #  🛡️ CRASH SHIELD / MEMORY
      # ==================================================================
      #  v108: bot ab ~62 MB par chalta hai, isliye ye thresholds kabhi
      #  chhuenge hi nahi. Phir bhi safety ke liye lage hue hain.
      - key: MEMORY_LIMIT_MB
        value: "512"           # plan ki RAM (free = 512)
      - key: MEM_RESTART_MB
        value: "429"           # clean restart threshold
      - key: MEM_RESTART_UPTIME_S
        value: "900"           # pehle 15 min me unnecessary restart na ho

      # ---------- 🚦 UPDATE GATE ----------
      - key: MAX_CONCURRENT_UPDATES
        value: "8"             # ek saath total updates (chat-wise order bani rahegi)
      - key: UPDATE_DEDUPE
        value: "on"            # Telegram ke retry (same update_id) drop karo
      - key: UPDATE_PER_CHAT_ORDER
        value: "on"            # ek hi user ke messages kram se chalen
      # hang par khud theek — loop 900s atka to clean restart. 0 = off.
      - key: HANG_RESTART_SECONDS
        value: "900"

      # ---------- 🧹 AUTO CLEANUP ----------
      - key: CLEANUP_MINUTES
        value: "60"

      # ---------- SELF-PING (free instance ko jaagte rakhta hai) ----------
      # Bot apna hi /health ping karta hai -> Render ko traffic lagta hai ->
      # 15-min sleep nahi hota -> bot ~instant respond karta hai.
      - key: BOT_SELF_URL
        value: https://utility-duniya-bot.onrender.com

      # ==================================================================
      #  📱 NUMBER INFO — aapki API
      # ==================================================================
      #  Poori guide: NUMBER-INFO-API-SETUP.md
      - key: MYNUM_API_URL
        sync: false            # number API endpoint (khali = built-in default)
      - key: MYNUM_API_KEY
        sync: false            # number API key (SECRET)
      - key: MYNUM_API_TIMEOUT
        value: "40"            # API slow hai — 10-60 second

      # ==================================================================
      #  👪 FAMILY INFO — aapki API
      # ==================================================================
      - key: FAMINFO_API_URL
        sync: false            # family API endpoint (khali = built-in default)
      - key: FAMINFO_API_KEY
        sync: false            # family API key (SECRET)
      - key: FAMINFO_API_TIMEOUT
        value: "40"

      # ---------- PRIVACY ----------
      - key: NUM_SHOW_FULL_IDS
        value: "0"             # 1 = Aadhaar/doc ID full dikhaye (0 = masked, safe)

      # ---------- SETTINGS ----------
      - key: ALL_FREE
        value: "on"            # dono tools sabke liye free (koi VIP/credit nahi)
