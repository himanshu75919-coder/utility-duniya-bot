# ===================================================================
#  Utility Duniya Super Bot — Render Blueprint (v46)
#
#  Existing Render service: utility-duniya-bot.
#  Sirf isi bot instance ko active rakhein; duplicate polling instances se
#  Telegram "Conflict: terminated by other getUpdates request" de sakta hai.
# ===================================================================
services:
  - type: web
    name: utility-duniya-bot
    runtime: python
    region: singapore          # India ke sabse paas — sabse fast
    plan: free
    branch: main
    autoDeploy: true           # GitHub par push hote hi deploy ho jaye
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health   # polling aur webhook dono modes me 200 OK route

    envVars:
      # ---------- ZAROORI (Render khud poochhega — yahan mat likho) ----------
      - key: BOT_TOKEN
        sync: false            # BotFather ka token (SECRET — sirf Render me daalo)
      - key: ADMIN_ID
        sync: false            # apni Telegram numeric ID (@userinfobot se milegi)

      # ---------- OPTIONAL (baad me bhi bhar sakte ho) ----------
      - key: ADMINS
        sync: false            # extra admins, comma se alag: 123456,789012
      - key: FORCE_CHANNEL
        sync: false            # jaise @YourChannel (force-join chahiye to)
      - key: FORCE_CHANNEL_LINK
        sync: false            # https://t.me/YourChannel
      - key: UPI_ID
        sync: false            # payment ke liye: yourname@upi
      - key: TUTORIAL_URL
        sync: false            # apna tutorial link (khali = bot khud banayega)
      - key: WEBHOOK_URL
        value: https://utility-duniya-bot.onrender.com  # Render par polling Conflict se bachne ke liye webhook default
      - key: WEBHOOK_SECRET
        sync: false            # webhook path ka optional secret (khali = token ka hissa)

      # ---------- OSINT HUB (aapka apna API — isi se data aata hai) ----------
      - key: OSINT_API_BASE
        value: https://osint-api-hub.onrender.com
      - key: OSINT_API_KEY
        value: Demo
      - key: OSINT_TIMEOUT
        value: "70"            # hub slow hai; bot beech me progress dikhata hai

      # ---------- DEVICE MODEL LOOKUP (TAC only; no full serial sent) ----------
      - key: IMEI_API_BASE
        value: https://osint-api-hub.onrender.com/api
      - key: IMEI_API_KEY
        value: Demo

      # ---------- PRIVACY / AUTHORIZED PROVIDERS ----------
      - key: NUM_LEAK_ENABLED
        value: "off"            # personal leaked-record search is not supported
      - key: VEHICLE_PROVIDER_AUTHORIZED
        value: "0"              # official portal links only unless provider is authorized

      # ---------- SETTINGS ----------
      - key: FREE_CREDITS
        value: "25"            # naye user ko itne premium credits
      - key: REFER_NEED
        value: "5"             # itne refer par free VIP
      - key: FREE_LIMIT
        value: "20"            # purana daily-limit var (ab use nahi hota)
      - key: NUM_SHOW_FULL_IDS
        value: "0"             # 1 = Aadhaar/doc ID bhi full dikhaye (0 = masked, safe)
      - key: UPI_NAME
        value: UtilityBot
      - key: BRAND_TAG
        value: "@Supermannn_x"
