# ===================================================================
#  Utility Duniya Super Bot — Render Blueprint (v60 FORTRESS)
#
#  ⚠️⚠️ SABSE ZAROORI BAAT — DATA KAHAN RAKHA JAYEGA ⚠️⚠️
#
#  Render ka FREE plan "ephemeral filesystem" deta hai. Iska matlab:
#      deploy / restart / sleep-wake / maintenance -> SAARA LOCAL DATA GAYAB
#
#  PEHLE yahi problem thi: bot ka poora database (VIP premium users,
#  payments, credits, referrals) ek local file `botdata.db` me tha, aur
#  deploy hone par wo file delete ho jati thi. Isliye premium users
#  "delete" ho jaate the.
#
#  ✅ AB ISKA HAL v60 me built-in hai — kuch kharidne ki zaroorat NAHI:
#     1. Local file ke saath-saath poora data ENCRYPTED backup ban kar
#        (a) aapke Telegram par aur (b) GitHub ke ek alag branch
#            (`vault-backup`) me chala jata hai.
#     2. Bot uthte hi pichhla backup MERGE karta hai — premium users
#        WAPAS aa jaate hain.
#     3. Restore se pehle aur baad me VIP count milaya jata hai; agar
#        VIP kam ho raha ho to restore ABORT ho jata hai.
#     >>> Isliye deploy/restart par premium user kho sakta hi nahi. <<<
#
#  💰 (Optional, sirf agar aap Render ka paid plan lein)
#     Ek persistent disk laga do to local file bhi permanent ho jayegi —
#     bot khud use detect kar lega, koi code change nahi:
#         disk:
#           name: utility-data
#           mountPath: /var/data      <- bot yahan khud botdata.db bana lega
#           sizeGB: 1
#     Free plan par disk available nahi hai — isliye upar wala vault
#     system hi asli bharosa hai. (Wahi default rehta hai.)
# ===================================================================

services:
  - type: web
    name: utility-duniya-bot
    runtime: python
    region: singapore          # India ke sabse paas — sabse fast
    plan: free
    branch: main
    autoDeploy: true           # GitHub par push hote hi deploy ho jaye
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health   # polling aur webhook dono modes me 200 OK route

    envVars:
      # ---------- ZAROORI (Render khud poochhega — yahan mat likho) ----------
      - key: BOT_TOKEN
        sync: false            # BotFather ka token (SECRET — sirf Render me daalo)
      - key: ADMIN_ID
        sync: false            # apni Telegram numeric ID (@userinfobot se milegi)

      # ---------- OPTIONAL (baad me bhi bhar sakte ho) ----------
      - key: ADMINS
        sync: false            # extra admins, comma se alag: 123456,789012
      - key: FORCE_CHANNEL
        sync: false            # jaise @YourChannel (force-join chahiye to)
      - key: FORCE_CHANNEL_LINK
        sync: false            # https://t.me/YourChannel
      - key: UPI_ID
        sync: false            # payment ke liye: yourname@upi
      - key: TUTORIAL_URL
        sync: false            # apna tutorial link (khali = bot khud banayega)
      # ---------- MODE (v59.9) ----------
      # DEFAULT = auto (webhook) — Render par sabse reliable. POLLING me deploy ke
      # waqt 10-20 second do instance ek saath getUpdates karte hain aur Telegram
      # "Conflict: terminated by other getUpdates request" deta hai (us waqt bot
      # jawab nahi deta). Webhook me Telegram khud update bhejta hai -> Conflict 0.
      # Safety: DNS check + Telegram preflight fail ho to bot chup-chaap POLLING
      # par chalta hai (crash nahi hota). Zabardasti polling chahiye to WEBHOOK_MODE=polling
      - key: WEBHOOK_MODE
        value: auto            # auto | on | polling | off
      - key: WEBHOOK_URL
        sync: false            # khali rakho = polling. Webhook ke liye service ka pura URL
      - key: WEBHOOK_SECRET
        sync: false            # webhook path ka optional secret (khali = token ka hissa)
      # ==================================================================
      #  v60 — 🛡️ PREMIUM VAULT (data kabhi na khoye) — YE ZAROOR BHARO
      # ==================================================================
      # Backup kahan jayega. Do jagah — dono free, dono automatic:
      #
      #  (a) TELEGRAM — backup aapko bot se ek file ke roop me milta hai
      #      (aapke ADMIN_ID wali chat me). Iske liye KUCH set karne ki
      #      zaroorat nahi — apne aap chalu rehta hai.
      #      Alag chat/channel chahiye to:
      #         VAULT_BACKUP_CHAT_ID = -1001234567890
      #
      #  (b) GITHUB — aapke token se offsite backup, AES-level encrypted
      #      (SHAKE256 + HMAC). Repo public ho to bhi koi padh nahi sakta.
      #      ⚠️ Ye token Render me hi daalo (SECRET), yaml me kabhi nahi.
      #      ⚠️ Backup ek ALAG branch (`vault-backup`) me jata hai — 'main'
      #         me nahi! Warna har backup Render ka naya deploy trigger kar
      #         deta aur bot ka infinite restart loop ban jata. Isliye
      #         VAULT_GITHUB_BRANCH ko 'main' NA karein.
      - key: VAULT_GITHUB_REPO
        value: himanshu75919-coder/utility-duniya-bot
      - key: VAULT_GITHUB_BRANCH
        value: vault-backup
      - key: VAULT_GITHUB_TOKEN
        sync: false            # 🔑 GitHub token (SECRET — sirf Render me daalo)
      - key: VAULT_KEY
        sync: false            # 🔑 (optional) apna encryption password. Khali = BOT_TOKEN se
      - key: VAULT_BACKUP_MINUTES
        value: "30"            # kitne minute me auto-backup (min 5)
      - key: VAULT_ENABLED
        value: "on"            # off = poora vault band
      - key: VAULT_BACKUP_CHAT_ID
        sync: false            # (optional) backup alag chat me bhejni ho to

      # ---------- v60: 🛡️ CRASH SHIELD ----------
      # Render free plan me sirf 512 MB RAM milti hai. Video + ffmpeg + PDF
      # ek saath chalein to process "Killed" ho jata hai (aapko crash dikhta
      # hai). Memory watchdog 400 MB par khud cache saaf karta hai.
      - key: MEMORY_LIMIT_MB
        value: "512"           # plan ki RAM (Starter=512, Standard=2048)
      # Bot "zinda" dikhe par jawab na de (hung loop) — tab khud restart.
      # 0 = sirf log karega. 600 = 10 minute se atka ho to restart.
      - key: HANG_RESTART_SECONDS
        value: "0"             # pehle 0 rakho; baar-baar hang ho to 600 karo

      # ---------- v60: 🧹 AUTO CLEANUP ----------
      # Purane temp files + expired caches khud safai hoti hai (disk bharne se bachao)
      - key: CLEANUP_MINUTES
        value: "45"

      # ---------- v52: SELF-PING (free instance ko jaagte rakhta hai = FAST respond) ----------
      # Bot apna hi /health ping karta hai -> Render ko inbound traffic lagta hai -> 15-min
      # sleep nahi hota -> cold start (30-60s) sirf pehli baar, baad me bot ~instant respond.
      - key: BOT_SELF_URL
        value: https://utility-duniya-bot.onrender.com

      # ---------- OSINT HUB (aapka apna API — isi se data aata hai) ----------
      - key: OSINT_API_BASE
        value: https://osint-api-hub.onrender.com
      - key: OSINT_API_KEY
        value: Demo
      - key: OSINT_TIMEOUT
        value: "70"            # hub slow hai; bot beech me progress dikhata hai

      # ---------- DEVICE MODEL LOOKUP (TAC only; no full serial sent) ----------
      - key: IMEI_API_BASE
        value: https://osint-api-hub.onrender.com/api
      - key: IMEI_API_KEY
        value: Demo

      # ---------- PRIVACY / AUTHORIZED PROVIDERS ----------
      - key: NUM_LEAK_ENABLED
        value: "off"            # personal leaked-record search is not supported
      # ---------- AAPKI LICENSED API (v49.6) ----------
      # Hub (osint-api-hub) par apni API lagane ke baad yahan kuch nahi chahiye.
      # Ye sirf tab bharo jab DIREct bot me provider lagana ho (aam taur par nahi).
      - key: VEHICLE_PROVIDER_URL
        sync: false            # aapki vehicle API ka endpoint (hub par lagayi hai to khali)
      - key: VEHICLE_PROVIDER_KEY
        sync: false            # us API ki key
      # ---------- v57: 📱 NUMBER INFO — AAPKI API (direct, hub ke bina) ----------
      # Ye lagate hi Number Info live carrier/circle data dega.
      # Poori guide: NUMBER-INFO-API-SETUP.md
      #   numverify   → URL=https://apilayer.net/api/validate
      #                 KEY_PARAM=access_key   PARAM=number
      #   abstractapi → URL=https://phonevalidation.abstractapi.com/v1/
      #                 KEY_PARAM=api_key      PARAM=phone
      - key: NUMINFO_PROVIDER_URL
        sync: false            # aapki carrier API ka endpoint (khali = offline mode)
      - key: NUMINFO_PROVIDER_KEY
        sync: false            # us API ki key (SECRET — sirf Render me rakho)
      - key: NUMINFO_PROVIDER_PARAM
        value: number          # number kis param me jaata hai (abstractapi: phone)
      - key: NUMINFO_PROVIDER_KEY_PARAM
        value: access_key      # numverify=access_key · abstractapi=api_key
      - key: NUMINFO_PROVIDER_AUTH
        value: query           # query | header | bearer | none
      - key: NUMINFO_PROVIDER_TIMEOUT
        value: "12"            # 4-30 second
      - key: VEHICLE_PROVIDER_AUTHORIZED
        value: "0"              # official portal links only unless provider is authorized

      # ---------- SETTINGS ----------
      - key: FREE_CREDITS
        value: "25"            # naye user ko itne premium credits
      - key: REFER_NEED
        value: "5"             # itne refer par free VIP
      - key: FREE_LIMIT
        value: "20"            # purana daily-limit var (ab use nahi hota)
      - key: NUM_SHOW_FULL_IDS
        value: "0"             # 1 = Aadhaar/doc ID bhi full dikhaye (0 = masked, safe)
      - key: UPI_NAME
        value: UtilityBot
      - key: BRAND_TAG
        value: "@Supermannn_x"
