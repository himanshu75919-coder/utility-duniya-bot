# 🛰️ HUB KEEP-AWAKE (v71)
# ---------------------------------------------------------------
# Render free plan 15 minute me app ko sula deta hai. Jab hub sota hai
# to bot ka pehla jawab 30-50 second leta hai. Ye workflow har 10 minute
# me hub ko chhoo kar jagaata rehta hai — full speed, hamesha.
#
# Kuch setup nahi chahiye — GitHub Actions free hai, repo me ye file
# pahunchte hi apne aap chalna shuru ho jayega.
name: Keep API Hub Awake

on:
  schedule:
    - cron: "*/10 * * * *"      # har 10 minute
  workflow_dispatch: {}          # chaaho to haath se bhi chalao

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping hub health
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/hub.json -w "%{http_code}" --max-time 55 \
                   https://osint-api-hub.onrender.com/health || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 300 /tmp/hub.json; echo ""; exit 0
            fi
            sleep 20
          done
          echo "Hub ne jawab nahi diya (Render deploy chal raha hoga?)"; exit 1
